<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Orbit">
  <title>Orbit</title>

  <!--
    The small-size mark. The full logo (orbit-logo.svg) carries candlesticks
    and the brain/circuit motif, which are legible at 128px and turn to noise
    at 16px. A favicon has to survive being 16 pixels wide, so this keeps only
    the three shapes that still read at that size: planet, ring, satellite.
    Same gradient axis and geometry, so the two marks are obviously the same
    identity rather than two different logos.
  -->

  <defs>
    <linearGradient id="oi" x1="0.05" y1="0.95" x2="0.95" y2="0.05">
      <stop offset="0%" stop-color="#0FA2FF" />
      <stop offset="50%" stop-color="#3C6BF2" />
      <stop offset="100%" stop-color="#8B33EE" />
    </linearGradient>

    <mask id="iconRingFront">
      <rect x="-60" y="132" width="380" height="220" fill="#fff"
            transform="rotate(-22 128 132)" />
    </mask>
  </defs>

  <!-- far half of the ring -->
  <ellipse cx="128" cy="132" rx="118" ry="42"
           transform="rotate(-22 128 132)"
           fill="none" stroke="url(#oi)" stroke-width="18" />

  <!-- planet -->
  <circle cx="128" cy="132" r="74" fill="url(#oi)" />

  <!-- near half of the ring, over the planet -->
  <g mask="url(#iconRingFront)">
    <ellipse cx="128" cy="132" rx="118" ry="42"
             transform="rotate(-22 128 132)"
             fill="none" stroke="url(#oi)" stroke-width="18" />
  </g>

  <!-- satellite -->
  <circle cx="226" cy="86" r="24" fill="url(#oi)" />
</svg>
