name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # No env vars needed: tests/conftest.py forces an isolated database and
      # disables model downloads, live data and tracking before any test module
      # is imported. The suite must pass on a machine with no network and no
      # credentials, and configuring that here instead would let it silently
      # depend on the runner's environment.
      - name: Run tests
        working-directory: backend
        run: pytest -q --maxfail=1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: frontend
        run: npm run build
